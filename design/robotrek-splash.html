<title>РобоТрек — заставка</title>
<style>
  /* Загрузочная заставка «РобоТрек»: логотип перерисован в SVG, чтобы части
     двигались по отдельности. Сценарий (~8,6 с): буквы «робо» выпрыгивают, шестерёнка
     въезжает и крутится, появляется «ТРЕК», сквозь буквы петляет Шустрик,
     Огонёк пикирует сверху, ловит его и садится на «б», из-за шестерёнки вырастает
     манипулятор, поднимается и щёлкает захватом, глазки следят за ним и
     моргают, затем всё плавно растворяется. */
  :root { --orange: #ff6600; --ink: #111; --bg: #fff; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  .splash { width: min(560px, 92vw); }
  .splash svg { width: 100%; height: auto; display: block; overflow: visible; }

  /* общий вход и растворение */
  .logo { animation: enter .35s ease-out both, leave .8s ease-in 7.8s forwards; transform-origin: 250px 130px; }
  @keyframes enter { from { opacity: 0 } to { opacity: 1 } }
  @keyframes leave { to { opacity: 0; transform: scale(1.05); filter: blur(4px) } }

  /* Точки вращения и масштаба везде заданы числами в координатах рисунка:
     Safari плохо понимает transform-box: fill-box (особенно у текста) и
     крутил «ТРЕК» вокруг левого верхнего угла. */
  /* буквы выпрыгивают по очереди */
  .pop { animation: pop .55s cubic-bezier(.3,1.7,.5,1) both; }
  .l1 { animation-delay: .10s } .l2 { animation-delay: .22s } .l3 { animation-delay: .34s } .l4 { animation-delay: .46s }
  @keyframes pop { from { opacity: 0; transform: translateY(30px) scale(.4) } to { opacity: 1; transform: none } }

  /* рука-манипулятор: после шестерёнки вырастает из-за неё — плечо, локоть,
     предплечье, захват, — потом поднимается, кусает и возвращается на место */
  .arm { fill: none; stroke: var(--orange); stroke-width: 13.5; stroke-linecap: butt; stroke-dasharray: 1 2; stroke-dashoffset: 1.01; }
  .a3 { animation: draw .40s ease-in 4.40s forwards }
  .a2 { animation: draw .35s ease-out 4.85s forwards }
  .jaw { stroke-width: 17.4; stroke-linecap: butt; animation: draw .35s ease-out 5.15s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0 } }
  .joint { fill: var(--bg); stroke: var(--orange); stroke-width: 14; transform-origin: 237px 52px; animation: jpop .4s cubic-bezier(.3,1.8,.5,1) 4.70s both; }
  @keyframes jpop { from { transform: scale(0) } to { transform: scale(1) } }

  .shoulder { transform-origin: 342px 112px; animation: shoulder 1.7s 5.55s both; }
  .elbow    { transform-origin: 237px 52px;  animation: elbow 1.7s 5.55s both; }
  .wrist    { transform-origin: 95.8px 82px; animation: wrist 1.7s 5.55s both; }
  .jaw-a    { transform-origin: 95.8px 82px; animation: draw .35s ease-out 5.15s forwards, jawA 1.7s 5.55s both; }
  .jaw-b    { transform-origin: 95.8px 82px; animation: draw .35s ease-out 5.15s forwards, jawB 1.7s 5.55s both; }
  @keyframes shoulder { 0% { transform: rotate(0) } 30% { transform: rotate(6deg) } 60% { transform: rotate(-1deg) } 82% { transform: rotate(1deg) } 100% { transform: rotate(0) } }
  @keyframes elbow    { 0% { transform: rotate(0) } 30% { transform: rotate(9deg) } 60% { transform: rotate(-3deg) } 82% { transform: rotate(1.5deg) } 100% { transform: rotate(0) } }
  @keyframes wrist    { 0% { transform: rotate(0) } 30% { transform: rotate(-16deg) } 60% { transform: rotate(8deg) } 100% { transform: rotate(0) } }
  /* губки захвата: раскрываются на подъёме, щёлкают внизу */
  @keyframes jawA { 0% { transform: rotate(0) } 28% { transform: rotate(16deg) } 52%, 68% { transform: rotate(-5deg) } 100% { transform: rotate(0) } }
  @keyframes jawB { 0% { transform: rotate(0) } 28% { transform: rotate(-16deg) } 52%, 68% { transform: rotate(5deg) } 100% { transform: rotate(0) } }
  .shoulder, .elbow, .wrist { animation-timing-function: ease-in-out; }

  /* шестерёнка: въезжает с поворотом, потом крутится, пока заставка на экране */
  .gear-in { transform-origin: 387px 144px; animation: gearin .9s cubic-bezier(.2,1.3,.4,1) .55s both; }
  @keyframes gearin { from { opacity: 0; transform: scale(.3) rotate(-200deg) } to { opacity: 1; transform: none } }
  .teeth { transform-origin: 387px 144px; animation: spin 2.4s linear 1.45s infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .trek { transform-origin: 383px 145px; animation: trek .45s cubic-bezier(.3,1.6,.5,1) 1.25s both; }
  @keyframes trek { from { opacity: 0; transform: scale(.5) skewX(-12deg) } to { opacity: 1; transform: none } }

  .lid { animation: blink .22s ease-in-out 1.55s, blink .26s ease-in-out 7.35s, blink .26s ease-in-out 7.7s; }
  @keyframes blink { 50% { transform: scaleY(.1) } }

  /* подпись */
  .tag { animation: tag .6s ease-out 1.5s both; }
  @keyframes tag { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

  @media (prefers-reduced-motion: reduce) {
    .pop, .arm, .jaw-a, .jaw-b, .joint, .shoulder, .elbow, .wrist, .gear-in, .teeth, .trek, .pupil, .lid, .tag, .chase-f, .chase-f > g, .wing { animation: none !important; stroke-dashoffset: 0; }
    .trails, .chase-s, .star { display: none; }
  }

<script>
  // Шестерёнка: 20 зубцов-трапеций вокруг (387,144) и круглое окно под «ТРЕК»
  (function () {
    const cx = 387, cy = 144, R = 75, r = 64, hole = 47.5, n = 20
    let d = ''
    for (let i = 0; i < n; i++) {
      const s = (Math.PI * 2) / n, a = i * s - s * 0.27
      const pts = [[r, a], [R, a + s * 0.12], [R, a + s * 0.42], [r, a + s * 0.54], [r, a + s]]
      for (const [rad, ang] of pts) d += (d ? 'L' : 'M') + (cx + rad * Math.cos(ang)).toFixed(1) + ' ' + (cy + rad * Math.sin(ang)).toFixed(1)
    }
    d += 'Z M' + (cx + hole) + ' ' + cy + ' a' + hole + ' ' + hole + ' 0 1 0 ' + -2 * hole + ' 0 a' + hole + ' ' + hole + ' 0 1 0 ' + 2 * hole + ' 0Z'
    document.getElementById('gear').setAttribute('d', d)
  })()

  // Перезапуск: клонируем SVG, чтобы все CSS-анимации начались заново
  const host = document.getElementById('splash')
  function replay() {
    const svg = host.querySelector('svg')
    host.replaceChild(svg.cloneNode(true), svg)
  }
  document.getElementById('again').onclick = replay
  setInterval(() => { if (document.getElementById('loop').checked) replay() }, 9200)
</script>
