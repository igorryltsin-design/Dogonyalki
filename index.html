    <!-- Заставка РобоТрек: обычный HTML и CSS, рисуется сразу, пока браузер
         грузит и запускает игру (исходник анимации — design/robotrek-splash.html).
         Уходит, когда игра прислала «dogonyalki:ready» и сцена досмотрена;
         клик или клавиша — пропустить. -->
    <style>
      #splash {
        --sp-orange: #ff6600; --sp-ink: #111; --sp-bg: #f4f1e8;
        position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
        background: var(--sp-bg); cursor: pointer; transition: opacity .8s ease-in;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #splash svg { width: min(560px, 86vw); height: auto; display: block; overflow: visible; }
      #splash .sp-skip {
        position: absolute; bottom: 22px; left: 0; right: 0; text-align: center;
        font-size: 14px; color: #8a8576; opacity: 0; animation: sp-enter .6s ease-out 2s both;
      }
      #splash.sp-out { opacity: 0; pointer-events: none; }
      #splash.sp-out .sp-logo { animation: sp-leave .8s ease-in forwards; }
      /* splash:css — из design/robotrek-splash.html, переносит tools/splash-embed.py */
      /* общий вход и растворение */
      .sp-logo { animation: sp-enter .35s ease-out both; transform-origin: 250px 130px; }
      @keyframes sp-enter { from { opacity: 0 } to { opacity: 1 } }
      @keyframes sp-leave { to { opacity: 0; transform: scale(1.05); filter: blur(4px) } }

      /* Точки вращения и масштаба везде заданы числами в координатах рисунка:
         Safari плохо понимает transform-box: fill-box (особенно у текста) и
         крутил «ТРЕК» вокруг левого верхнего угла. */
      /* буквы выпрыгивают по очереди */
      .sp-pop { animation: sp-pop .55s cubic-bezier(.3,1.7,.5,1) both; }
      .sp-l1 { animation-delay: .10s } .sp-l2 { animation-delay: .22s } .sp-l3 { animation-delay: .34s } .sp-l4 { animation-delay: .46s }
      @keyframes sp-pop { from { opacity: 0; transform: translateY(30px) scale(.4) } to { opacity: 1; transform: none } }

      /* рука-манипулятор: после шестерёнки вырастает из-за неё — плечо, локоть,
         предплечье, захват, — потом поднимается, кусает и возвращается на место */
      .sp-arm { fill: none; stroke: var(--sp-orange); stroke-width: 13.5; stroke-linecap: butt; stroke-dasharray: 1 2; stroke-dashoffset: 1.01; }
      .sp-a3 { animation: sp-draw .40s ease-in 4.40s forwards }
      .sp-a2 { animation: sp-draw .35s ease-out 4.85s forwards }
      .sp-jaw { stroke-width: 17.4; stroke-linecap: butt; animation: sp-draw .35s ease-out 5.15s forwards; }
      @keyframes sp-draw { to { stroke-dashoffset: 0 } }
      .sp-joint { fill: var(--sp-bg); stroke: var(--sp-orange); stroke-width: 14; transform-origin: 237px 52px; animation: sp-jpop .4s cubic-bezier(.3,1.8,.5,1) 4.70s both; }
      @keyframes sp-jpop { from { transform: scale(0) } to { transform: scale(1) } }

      .sp-shoulder { transform-origin: 342px 112px; animation: sp-shoulder 1.7s 5.55s both; }
      .sp-elbow    { transform-origin: 237px 52px;  animation: sp-elbow 1.7s 5.55s both; }
      .sp-wrist    { transform-origin: 95.8px 82px; animation: sp-wrist 1.7s 5.55s both; }
      .sp-jaw-a    { transform-origin: 95.8px 82px; animation: sp-draw .35s ease-out 5.15s forwards, sp-jawA 1.7s 5.55s both; }
      .sp-jaw-b    { transform-origin: 95.8px 82px; animation: sp-draw .35s ease-out 5.15s forwards, sp-jawB 1.7s 5.55s both; }
      @keyframes sp-shoulder { 0% { transform: rotate(0) } 30% { transform: rotate(6deg) } 60% { transform: rotate(-1deg) } 82% { transform: rotate(1deg) } 100% { transform: rotate(0) } }
      @keyframes sp-elbow    { 0% { transform: rotate(0) } 30% { transform: rotate(9deg) } 60% { transform: rotate(-3deg) } 82% { transform: rotate(1.5deg) } 100% { transform: rotate(0) } }
      @keyframes sp-wrist    { 0% { transform: rotate(0) } 30% { transform: rotate(-16deg) } 60% { transform: rotate(8deg) } 100% { transform: rotate(0) } }
      /* губки захвата: раскрываются на подъёме, щёлкают внизу */
      @keyframes sp-jawA { 0% { transform: rotate(0) } 28% { transform: rotate(16deg) } 52%, 68% { transform: rotate(-5deg) } 100% { transform: rotate(0) } }
      @keyframes sp-jawB { 0% { transform: rotate(0) } 28% { transform: rotate(-16deg) } 52%, 68% { transform: rotate(5deg) } 100% { transform: rotate(0) } }
      .sp-shoulder, .sp-elbow, .sp-wrist { animation-timing-function: ease-in-out; }

      /* шестерёнка: въезжает с поворотом, потом крутится, пока заставка на экране */
      .sp-gear-in { transform-origin: 387px 144px; animation: sp-gearin .9s cubic-bezier(.2,1.3,.4,1) .55s both; }
      @keyframes sp-gearin { from { opacity: 0; transform: scale(.3) rotate(-200deg) } to { opacity: 1; transform: none } }
      .sp-teeth { transform-origin: 387px 144px; animation: sp-spin 2.4s linear 1.45s infinite; }
      @keyframes sp-spin { to { transform: rotate(360deg) } }
      .sp-trek { transform-origin: 383px 145px; animation: sp-trek .45s cubic-bezier(.3,1.6,.5,1) 1.25s both; }
      @keyframes sp-trek { from { opacity: 0; transform: scale(.5) skewX(-12deg) } to { opacity: 1; transform: none } }

      .sp-lid { animation: sp-blink .22s ease-in-out 1.55s, sp-blink .26s ease-in-out 7.35s, sp-blink .26s ease-in-out 7.7s; }
      @keyframes sp-blink { 50% { transform: scaleY(.1) } }

      /* подпись */
      .sp-tag { animation: sp-tag .6s ease-out 1.5s both; }
      @keyframes sp-tag { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

      @media (prefers-reduced-motion: reduce) {
        .sp-pop, .sp-arm, .sp-jaw-a, .sp-jaw-b, .sp-joint, .sp-shoulder, .sp-elbow, .sp-wrist, .sp-gear-in, .sp-teeth, .sp-trek, .sp-pupil, .sp-lid, .sp-tag, .sp-chase-f, .sp-chase-f > g, .sp-wing { animation: none !important; stroke-dashoffset: 0; }
        .sp-trails, .sp-chase-s, .sp-star { display: none; }
      }

      /* погоня: сгенерировано tools/splash-chase.py — правьте там */

      .sp-chase-f { transform-origin: 0 0; transform: translate(192.0px, 87.0px) rotate(-209deg); animation: sp-f-move 1.80s linear 1.8s backwards, sp-f-perch 1.00s ease-out 3.6s forwards; }
      .sp-chase-f > g { animation: sp-show .12s 1.8s both; }
      .sp-wing { animation: sp-flap .07s linear 1.8s 40 alternate; }
      .sp-wing-l { transform-origin: -1px -2px } .sp-wing-r { transform-origin: -1px 2px }
      @keyframes sp-flap { to { transform: scaleY(.35) } }
      @keyframes sp-show { from { opacity: 0 } to { opacity: 1 } }
      @keyframes sp-gulp { from { opacity: 1; transform: translate(326px, 84px) scale(1) } to { opacity: 0; transform: translate(326px, 84px) scale(0) } }
      .sp-trail { fill: none; stroke-dasharray: 1 2; stroke-dashoffset: 1.01; }
      .sp-trail-s { stroke: #fff; stroke-width: 9; animation: sp-draw 3.00s linear 0.6s forwards; }
      .sp-trail-f { stroke: #1f8a4c; stroke-width: 3; stroke-linecap: round; animation: sp-draw 1.80s linear 1.8s forwards; }
      .sp-trails { animation: sp-fade .45s ease-in 3.65s forwards; }
      @keyframes sp-fade { to { opacity: 0 } }

    <script>
      ;(function () {
        var el = document.getElementById('splash')
        if (!el) return
        var quick = false
        try {
          quick = sessionStorage.getItem('dogonjalki-splash') === '1'
          sessionStorage.setItem('dogonjalki-splash', '1')
        } catch (e) {}
        var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
        if (quick || still) el.classList.add('sp-quick')
        // полная сцена (погоня, поимка, рука) досматривается до конца хватания, короткая — секунда с небольшим
        var minMs = quick || still ? 1200 : 7300
        var t0 = Date.now(), ready = false, skipped = false, gone = false
        function hide() {
          if (gone || !ready) return
          var left = minMs - (Date.now() - t0)
          if (!skipped && left > 0) return void setTimeout(hide, left)
          gone = true
          el.classList.add('sp-out')
          window.removeEventListener('keydown', skip)
          setTimeout(function () { el.remove() }, 850)
        }
        function skip() {
          skipped = true
          if (!ready) el.classList.add('sp-wait')
          hide()
        }
        window.addEventListener('dogonyalki:ready', function () { ready = true; hide() })
        el.addEventListener('click', skip)
        window.addEventListener('keydown', skip)
        setTimeout(function () { if (!ready) el.classList.add('sp-wait') }, minMs)
        // страховка: игра упала до готовности — заставка не должна прятать сообщение об ошибке
        setTimeout(function () { ready = true; skipped = true; hide() }, 15000)
        window.addEventListener('error', function () { ready = true; skipped = true; hide() })
      })()
    </script>
    <script>
      // фатальные ошибки — видимым текстом, чтобы игра не молчала чёрным экраном
      window.addEventListener('error', function (e) {
        var d = document.createElement('pre')
        d.style.cssText =
          'position:fixed;top:0;left:0;z-index:9999;background:#2a0d08;color:#ffb4a4;padding:10px;font:12px/1.5 monospace;white-space:pre-wrap;max-width:100vw;margin:0'
        d.textContent = 'Ошибка игры: ' + (e.error && e.error.stack ? e.error.stack : e.message)
        ;(document.body || document.documentElement).appendChild(d)
      })
    </script>
